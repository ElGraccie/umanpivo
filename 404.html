<style>
:root{--amber:#ffc72c;--amber-2:#f6b627;--cream:#fff4dc;--f-display:"Geologica","Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sky:linear-gradient(180deg,#27324f 0,#3f4868 18%,#76627a 34%,#b9786f 50%,#e29a5c 64%,#f2b56c 78%,#fbd496 92%,#fde4b4 100%);
  --deep:#130d08;--sun:radial-gradient(circle,rgba(255,236,190,.95) 0,rgba(255,196,110,.7) 22%,rgba(255,160,70,.28) 46%,rgba(255,140,60,0) 70%);
  --wood1:#7a4a26;--wood2:#5e3519;--lip:rgba(255,214,150,.75)}
html[data-theme=spring]{--sky:linear-gradient(180deg,#2d6cb6 0,#4a88cf 16%,#78acdf 32%,#a8cbec 48%,#cfe3f2 62%,#e8f1f0 76%,#f6f6e8 90%,#fbf8ec 100%);--deep:#1f1520;

html[data-theme=autumn]{--sky:linear-gradient(180deg,#363b55 0,#585470 16%,#8a6a74 32%,#c4856a 48%,#e8a35e 62%,#f4be78 76%,#fbd9a2 90%,#fde8bd 100%);--deep:#1a110a;
  --sun:radial-gradient(circle,rgba(255,226,170,.95) 0,rgba(255,170,80,.66) 22%,rgba(240,120,50,.26) 46%,rgba(230,110,40,0) 70%)}
html[data-theme=winter]{--sky:linear-gradient(180deg,#42608e 0,#6f86b4 16%,#a4a2c4 32%,#d6a8b4 47%,#efb59c 61%,#f8cd9f 75%,#fde3bf 90%,#feeed2 100%);--deep:#0e1620;
  --sun:radial-gradient(circle,rgba(255,244,228,.95) 0,rgba(255,214,180,.6) 22%,rgba(240,180,170,.24) 46%,rgba(230,170,170,0) 70%);--wood1:#6e4a32;--wood2:#553624;--lip:rgba(255,240,230,.8)}
html[data-theme=newyear]{--sky:linear-gradient(180deg,#070c22 0,#0d1638 22%,#16245a 44%,#24387a 64%,#3a4f92 82%,#56679e 100%);--deep:#0a1028;
  --sun:radial-gradient(circle,rgba(236,242,255,.95) 0,rgba(200,214,255,.5) 18%,rgba(150,170,255,.18) 42%,rgba(140,160,255,0) 66%);--wood1:#5c3c28;--wood2:#47291a;--lip:rgba(220,230,255,.7)}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--deep)}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;font-family:var(--f-body);color:var(--cream);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}

/* ---------- scene: season sky, sun/moon, particles, table */
.scene{position:relative;flex:none;height:clamp(330px,58svh,560px);background:var(--sky);overflow:hidden;isolation:isolate}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,4,.42) 0,rgba(12,8,4,.12) 30%,transparent 55%);pointer-events:none}
.sun{position:absolute;left:50%;bottom:-6%;width:min(92vmin,760px);aspect-ratio:1;transform:translateX(-50%);background:var(--sun);border-radius:50%;z-index:0;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.04)}}
.fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.fx i{position:absolute;top:-30px;display:block}

/* the table the digits stand on */
.table{position:relative;z-index:3;height:30px;margin-top:-30px;
  background:linear-gradient(180deg,var(--lip) 0,var(--lip) 2px,transparent 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 140px),
  linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:0 14px 30px rgba(0,0,0,.45)}
.table::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent);pointer-events:none}

/* ---------- header */
.top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--amber)}
.logo .mk{height:34px;width:auto}
.logo .wm{height:17px;width:auto}
.top .sp{flex:1}
.top .hot{font-size:14px;color:rgba(255,244,220,.85);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.top .hot a{font-weight:600;text-decoration:none;color:#fff}
.top .hot a:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- 4 [glass] 4 */
.big{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1.6vw,18px);
  font:700 clamp(130px,27vw,330px)/.74 var(--f-display);letter-spacing:-.02em;user-select:none}
.big .d{display:block;padding-bottom:.02em;background:linear-gradient(180deg,#ffe28a 0,var(--amber) 38%,var(--amber-2) 70%,#c9800f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 .03em 0 rgba(90,50,8,.0);position:relative}
.big .d::after{content:attr(data-d);position:absolute;left:0;top:0;z-index:-1;color:transparent;-webkit-text-stroke:.018em rgba(70,38,6,.45);transform:translateY(.02em)}
.glass{display:block;height:.86em;width:auto;margin:0 .02em;overflow:visible}
.glass .bub{animation:rise 3.4s linear infinite;opacity:0}
.glass .bub:nth-of-type(2){animation-delay:-.9s;animation-duration:2.8s}.glass .bub:nth-of-type(3){animation-delay:-1.7s;animation-duration:3.9s}
.glass .bub:nth-of-type(4){animation-delay:-2.4s}.glass .bub:nth-of-type(5){animation-delay:-.4s;animation-duration:3.1s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.8}100%{transform:translateY(-34px);opacity:0}}
.big .sh{position:absolute;left:50%;bottom:-2px;width:min(78vw,820px);height:26px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(10,4,0,.55),rgba(10,4,0,0));z-index:-1}

/* ---------- text block */
.msg{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(34px,6vh,64px) 20px 54px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
h1{font:700 clamp(30px,5vw,54px)/1.05 var(--f-display);letter-spacing:-.01em;margin:0 0 14px;color:#fff;text-wrap:balance}
.msg p.lede{max-width:34em;margin:0 0 28px;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:rgba(255,244,220,.78);text-wrap:pretty}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:16px;font:600 16px/1 var(--f-body);text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn.pri{background:var(--amber);color:#1b1304;box-shadow:0 14px 30px -14px rgba(255,199,44,.8)}
.btn.pri:hover{background:#ffd34f;transform:translateY(-2px)}
.btn.gh{border:1.5px solid rgba(255,244,220,.32);color:#fff;background:rgba(255,255,255,.04)}
.btn.gh:hover{border-color:rgba(255,244,220,.7);background:rgba(255,255,255,.08);transform:translateY(-2px)}
.btn svg{width:18px;height:18px}
.note{margin:30px 0 0;font-size:14px;color:rgba(255,244,220,.55)}
.note a{color:rgba(255,244,220,.9);font-weight:600;text-decoration:none}.note a:hover{text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.logo:focus-visible,.note a:focus-visible,.top a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}

@media (max-width:640px){
  .top .hot{display:none}
  .logo .mk{height:30px}.logo .wm{height:15px}
  .scene{height:clamp(290px,46svh,420px)}
  .big{font-size:40vw}
  .btn{flex:1 1 100%;justify-content:center}
  .acts{width:100%;max-width:380px}
}
@media (prefers-reduced-motion:reduce){.sun,.fx i,.glass .bub{animation:none!important}.fx{display:none}}

/* ---------- season particles (no CSS filter anywhere: iOS 26.4 paints a black square for off-screen filters) */
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx,40px),calc(58svh + 80px),0) rotate(var(--r,320deg))}}
@keyframes float{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(var(--dx,20px),-26px);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.fx .pt{width:12px;height:8px;border-radius:60% 40% 60% 40%;animation:fall linear infinite}
.fx .ff{top:auto;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0,#ffd23c 38%,rgba(255,200,40,0) 72%);animation:float ease-in-out infinite}
.fx .lf{width:18px;height:18px;animation:fall linear infinite}
.fx .sn{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.92);animation:fall linear infinite}
.garland{position:absolute;left:-2%;width:104%;top:62px;height:90px;z-index:1;pointer-events:none;display:none}
html[data-theme=newyear] .garland{display:block}
.garland i{position:absolute;width:12px;height:16px;border-radius:50% 50% 45% 45%;animation:blink 2.4s ease-in-out infinite}
.garland i::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 70%);opacity:.55}

/* demo badge */
.demo{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(20,14,8,.82);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:700 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#ffd66b;pointer-events:none}.demo i{width:8px;height:8px;border-radius:50%;background:#ffc72c;box-shadow:0 0 0 3px rgba(255,199,44,.25)}.msg{padding-bottom:92px}
